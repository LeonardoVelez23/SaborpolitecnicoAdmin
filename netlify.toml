# Panel del personal SaborHub como SPA estática.
[build]
  command = "npm run build"
  publish = "dist/saborhub-admin/browser"

[build.environment]
  NODE_VERSION = "24"

# Todas las rutas las resuelve Angular.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
